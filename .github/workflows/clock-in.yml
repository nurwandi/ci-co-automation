name: Clock In

on:
  workflow_dispatch:

jobs:
  clock-in:
    if: github.event_name == 'workflow_dispatch' || vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      TALENTA_EMAIL: ${{ secrets.TALENTA_EMAIL }}
      TALENTA_PASSWORD: ${{ secrets.TALENTA_PASSWORD }}
      HEADLESS: "true"
      TZ: Asia/Jakarta

    steps:
      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-3

      - name: Launch exit node (spot)
        id: ec2
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "TS_AUTHKEY=${TS_AUTHKEY}" > /tmp/userdata.txt
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ secrets.EC2_AMI_ID }} \
            --instance-type t3.micro \
            --instance-market-options '{"MarketType":"spot"}' \
            --subnet-id ${{ secrets.EC2_SUBNET_ID }} \
            --security-group-ids ${{ secrets.EC2_SG_ID }} \
            --user-data file:///tmp/userdata.txt \
            --metadata-options "HttpTokens=optional" \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=ci-exit-node}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          rm -f /tmp/userdata.txt
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched $INSTANCE_ID, waiting for status ok..."
          aws ec2 wait instance-status-ok --instance-ids $INSTANCE_ID
          echo "Instance $INSTANCE_ID is ready"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Wait for exit node and route traffic
        run: |
          echo "Waiting for exit node to appear..."
          for i in $(seq 1 60); do
            EXIT_NODE=$(tailscale status | grep "ci-exit-node" | grep "offers exit node" | grep -v "offline" | awk '{print $2}' | head -1)
            if [ -n "$EXIT_NODE" ]; then
              echo "Exit node found: $EXIT_NODE"
              break
            fi
            echo "Attempt $i/60 — waiting 5s..."
            sleep 5
          done
          if [ -z "$EXIT_NODE" ]; then
            echo "::error::Exit node not found after 5 minutes"
            exit 1
          fi
          sudo -E tailscale set --exit-node="$EXIT_NODE" --accept-routes

      - name: Verify IP location
        run: curl -s https://ipinfo.io/json | jq '{ip, city, region, country}'

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 421 + 180))
          echo "Waiting ${DELAY}s (~$((DELAY / 60))m) before clock in..."
          sleep $DELAY

      - name: Determine geolocation
        id: geo
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] || [ "$DOW" = "5" ]; then
            echo "Monday/Friday — using alternate location"
            echo "lat=-6.2118931" >> $GITHUB_OUTPUT
            echo "lng=106.8264782" >> $GITHUB_OUTPUT
            echo "label=Home (Mon/Fri)" >> $GITHUB_OUTPUT
          else
            echo "Tue-Thu — using default location"
            echo "lat=-6.1993335" >> $GITHUB_OUTPUT
            echo "lng=106.7623687" >> $GITHUB_OUTPUT
            echo "label=Default Office (Tue-Thu)" >> $GITHUB_OUTPUT
          fi

      - name: Record clock time
        id: clock
        run: echo "time=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Run clock-in
        run: pnpm run clock-in
        env:
          GEO_LAT: ${{ steps.geo.outputs.lat }}
          GEO_LNG: ${{ steps.geo.outputs.lng }}

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-screenshot-clock-in-${{ github.run_number }}
          path: error-*.png
          retention-days: 3

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEO_LABEL: ${{ steps.geo.outputs.label }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOCK_TIME: ${{ steps.clock.outputs.time }}
          START_TIME: ${{ steps.timer.outputs.start }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"; LABEL="Successful"; COLOR=5763719
            MSG="Clock In successful at ${CLOCK_TIME} WIB <@${{ vars.DISCORD_USER_ID }}>"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI="⚠️"; LABEL="Cancelled"; COLOR=16776960
            MSG="Clock In cancelled <@${{ vars.DISCORD_USER_ID }}>"
          else
            EMOJI="❌"; LABEL="Failed!"; COLOR=15548997
            MSG="Clock In failed at ${CLOCK_TIME} WIB! Check logs <@${{ vars.DISCORD_USER_ID }}>"
          fi

          ELAPSED=$(( $(date +%s) - START_TIME ))
          DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"

          FOOTER=""
          if [ "$JOB_STATUS" = "failure" ]; then
            FOOTER=',"footer":{"text":"⚠️ Action Required: Check error screenshot in artifacts."}'
          fi

          JSON=$(cat <<EOF
          {
            "content": "${MSG}",
            "embeds": [{
              "title": "${EMOJI} Clock In ${LABEL}",
              "url": "${RUN_URL}",
              "color": ${COLOR},
              "fields": [
                {"name": "Workflow", "value": "Clock In", "inline": true},
                {"name": "Status", "value": "${JOB_STATUS}", "inline": true},
                {"name": "Date", "value": "${CLOCK_TIME} WIB", "inline": true},
                {"name": "Run", "value": "#${RUN_NUMBER} (Attempt #${RUN_ATTEMPT})", "inline": true},
                {"name": "Location", "value": "${GEO_LABEL}", "inline": true},
                {"name": "Duration", "value": "${DURATION}", "inline": true}
              ]
              ${FOOTER}
            }]
          }
          EOF
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "$DISCORD_WEBHOOK_URL")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Discord notification failed (HTTP ${HTTP_CODE}): ${BODY}"
          else
            echo "Discord notification sent successfully"
          fi

      - name: Terminate exit node
        if: always()
        run: |
          if [ -n "${{ steps.ec2.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances --instance-ids ${{ steps.ec2.outputs.instance_id }}
            echo "Terminated ${{ steps.ec2.outputs.instance_id }}"
          fi
