name: Clock Out

on:
  workflow_dispatch:

jobs:
  clock-out:
    if: github.event_name == 'workflow_dispatch' || vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TALENTA_EMAIL: ${{ secrets.TALENTA_EMAIL }}
      TALENTA_PASSWORD: ${{ secrets.TALENTA_PASSWORD }}
      HEADLESS: "true"
      TZ: Asia/Jakarta

    steps:
      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Route traffic through exit node
        run: sudo -E tailscale set --exit-node=${{ secrets.TS_EXIT_NODE }} --accept-routes

      - name: Verify IP location
        run: curl -s https://ipinfo.io/json | jq '{ip, city, region, country}'

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 421 + 180))
          echo "Waiting ${DELAY}s (~$((DELAY / 60))m) before clock out..."
          sleep $DELAY

      - name: Determine geolocation
        id: geo
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] || [ "$DOW" = "5" ]; then
            echo "Monday/Friday — using alternate location"
            echo "lat=-6.2118931" >> $GITHUB_OUTPUT
            echo "lng=106.8264782" >> $GITHUB_OUTPUT
            echo "label=Home (Mon/Fri)" >> $GITHUB_OUTPUT
          else
            echo "Tue-Thu — using default location"
            echo "lat=-6.1993335" >> $GITHUB_OUTPUT
            echo "lng=106.7623687" >> $GITHUB_OUTPUT
            echo "label=Default Office (Tue-Thu)" >> $GITHUB_OUTPUT
          fi

      - name: Record clock time
        id: clock
        run: echo "time=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Run clock-out
        run: pnpm run clock-out
        env:
          GEO_LAT: ${{ steps.geo.outputs.lat }}
          GEO_LNG: ${{ steps.geo.outputs.lng }}

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-screenshot-clock-out-${{ github.run_number }}
          path: error-*.png
          retention-days: 3

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEO_LABEL: ${{ steps.geo.outputs.label }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOCK_TIME: ${{ steps.clock.outputs.time }}
          START_TIME: ${{ steps.timer.outputs.start }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"; LABEL="Successful"; COLOR=5763719
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI="⚠️"; LABEL="Cancelled"; COLOR=16776960
          else
            EMOJI="❌"; LABEL="Failed!"; COLOR=15548997
          fi

          ELAPSED=$(( $(date +%s) - START_TIME ))
          DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"

          FOOTER=""
          if [ "$JOB_STATUS" = "failure" ]; then
            FOOTER=',"footer":{"text":"⚠️ Action Required: Check error screenshot in artifacts."}'
          fi

          JSON=$(cat <<EOF
          {
            "content": "<@710595837067264082>",
            "embeds": [{
              "title": "${EMOJI} Clock Out ${LABEL}",
              "url": "${RUN_URL}",
              "color": ${COLOR},
              "fields": [
                {"name": "Workflow", "value": "Clock Out", "inline": true},
                {"name": "Status", "value": "${JOB_STATUS}", "inline": true},
                {"name": "Date", "value": "${CLOCK_TIME} WIB", "inline": true},
                {"name": "Run", "value": "#${RUN_NUMBER} (Attempt #${RUN_ATTEMPT})", "inline": true},
                {"name": "Location", "value": "${GEO_LABEL}", "inline": true},
                {"name": "Duration", "value": "${DURATION}", "inline": true}
              ]
              ${FOOTER}
            }]
          }
          EOF
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "$DISCORD_WEBHOOK_URL")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Discord notification failed (HTTP ${HTTP_CODE}): ${BODY}"
          else
            echo "Discord notification sent successfully"
          fi
