name: Clock Out

on:
  workflow_dispatch:

jobs:
  clock-out:
    if: github.event_name == 'workflow_dispatch' || vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      TALENTA_EMAIL: ${{ secrets.TALENTA_EMAIL }}
      TALENTA_PASSWORD: ${{ secrets.TALENTA_PASSWORD }}
      HEADLESS: "true"
      TZ: Asia/Jakarta

    steps:
      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-3

      - name: Launch exit node (spot)
        id: ec2
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          cat > /tmp/userdata.sh << UDEOF
          #!/bin/bash
          sysctl -w net.ipv4.ip_forward=1
          sysctl -w net.ipv6.conf.all.forwarding=1
          for i in \$(seq 1 30); do
            tailscale status >/dev/null 2>&1 && break
            sleep 2
          done
          tailscale up --authkey="${TS_AUTHKEY}" --hostname=ci-exit-node --advertise-exit-node
          UDEOF
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ secrets.EC2_AMI_ID }} \
            --instance-type t3.micro \
            --instance-market-options '{"MarketType":"spot"}' \
            --subnet-id ${{ secrets.EC2_SUBNET_ID }} \
            --security-group-ids ${{ secrets.EC2_SG_ID }} \
            --user-data file:///tmp/userdata.sh \
            --metadata-options "HttpTokens=optional" \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=ci-exit-node}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          rm -f /tmp/userdata.sh
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched $INSTANCE_ID, waiting for status ok..."
          aws ec2 wait instance-status-ok --instance-ids $INSTANCE_ID
          echo "Instance $INSTANCE_ID is ready"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Wait for exit node and route traffic
        run: |
          echo "Waiting for exit node to appear..."
          for i in $(seq 1 30); do
            if tailscale status | grep -q "ci-exit-node"; then
              echo "Exit node found"
              break
            fi
            echo "Attempt $i/30 — waiting 5s..."
            sleep 5
          done
          sudo -E tailscale set --exit-node=ci-exit-node --accept-routes

      - name: Verify IP location
        run: curl -s https://ipinfo.io/json | jq '{ip, city, region, country}'

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 421 + 180))
          echo "Waiting ${DELAY}s (~$((DELAY / 60))m) before clock out..."
          sleep $DELAY

      - name: Determine geolocation
        id: geo
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] || [ "$DOW" = "5" ]; then
            echo "Monday/Friday — using alternate location"
            echo "lat=-6.2118931" >> $GITHUB_OUTPUT
            echo "lng=106.8264782" >> $GITHUB_OUTPUT
            echo "label=Home (Mon/Fri)" >> $GITHUB_OUTPUT
          else
            echo "Tue-Thu — using default location"
            echo "lat=-6.1993335" >> $GITHUB_OUTPUT
            echo "lng=106.7623687" >> $GITHUB_OUTPUT
            echo "label=Default Office (Tue-Thu)" >> $GITHUB_OUTPUT
          fi

      - name: Record clock time
        id: clock
        run: echo "time=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Run clock-out
        run: pnpm run clock-out
        env:
          GEO_LAT: ${{ steps.geo.outputs.lat }}
          GEO_LNG: ${{ steps.geo.outputs.lng }}

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-screenshot-clock-out-${{ github.run_number }}
          path: error-*.png
          retention-days: 3

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEO_LABEL: ${{ steps.geo.outputs.label }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOCK_TIME: ${{ steps.clock.outputs.time }}
          START_TIME: ${{ steps.timer.outputs.start }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"; LABEL="Successful"; COLOR=5763719
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI="⚠️"; LABEL="Cancelled"; COLOR=16776960
          else
            EMOJI="❌"; LABEL="Failed!"; COLOR=15548997
          fi

          ELAPSED=$(( $(date +%s) - START_TIME ))
          DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"

          FOOTER=""
          if [ "$JOB_STATUS" = "failure" ]; then
            FOOTER=',"footer":{"text":"⚠️ Action Required: Check error screenshot in artifacts."}'
          fi

          JSON=$(cat <<EOF
          {
            "content": "<@710595837067264082>",
            "embeds": [{
              "title": "${EMOJI} Clock Out ${LABEL}",
              "url": "${RUN_URL}",
              "color": ${COLOR},
              "fields": [
                {"name": "Workflow", "value": "Clock Out", "inline": true},
                {"name": "Status", "value": "${JOB_STATUS}", "inline": true},
                {"name": "Date", "value": "${CLOCK_TIME} WIB", "inline": true},
                {"name": "Run", "value": "#${RUN_NUMBER} (Attempt #${RUN_ATTEMPT})", "inline": true},
                {"name": "Location", "value": "${GEO_LABEL}", "inline": true},
                {"name": "Duration", "value": "${DURATION}", "inline": true}
              ]
              ${FOOTER}
            }]
          }
          EOF
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "$DISCORD_WEBHOOK_URL")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Discord notification failed (HTTP ${HTTP_CODE}): ${BODY}"
          else
            echo "Discord notification sent successfully"
          fi

      - name: Terminate exit node
        if: always()
        run: |
          if [ -n "${{ steps.ec2.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances --instance-ids ${{ steps.ec2.outputs.instance_id }}
            echo "Terminated ${{ steps.ec2.outputs.instance_id }}"
          fi
